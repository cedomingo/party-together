project_id = "party-together"

[auth]
enabled = true
# Required: every player's identity is a Supabase Anonymous Auth session
# (see SPEC.md §2 and supabase/PHASE1_NOTES.md). Without this, no player
# ever gets a real auth.uid() and every RLS policy in migrations/ that
# checks auth.uid() will simply deny everyone.
enable_anonymous_sign_ins = true

[db]
port = 54322
